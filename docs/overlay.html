<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora — $AZAN broadcast overlay</title>
<style>
  :root {
    --ink: #0A0A0B; --ink-2: #5A6472; --blue: #0062FF; --violet: #7C3AED;
    --up: #059669; --down: #DC2626;
    --card: rgba(255,255,255,.90); --hairline: rgba(12,18,32,.10);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #101623; color: var(--ink); overflow: hidden;
  }
  body.chroma { background: #00ff00; }
  body.chroma .hint { display: none; }

  /* lower-third card — broadcast scale */
  .lower {
    position: fixed; left: 48px; bottom: 48px; width: 640px;
    background: var(--card); border: 1px solid rgba(255,255,255,.65); border-radius: 24px;
    padding: 24px 28px 20px; backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px rgba(10,20,60,.35), inset 0 1px 0 rgba(255,255,255,.8);
  }
  .head { display: flex; align-items: center; gap: 14px; }
  .glyph { width: 52px; height: 52px; }
  .glyph img { width: 100%; height: 100%; object-fit: contain; }
  .who b { font-size: 24px; display: block; letter-spacing: -0.01em; }
  .who span { font-size: 13.5px; color: var(--ink-2); }
  .live { display: inline-flex; align-items: center; gap: 6px; }
  .live i { width: 8px; height: 8px; border-radius: 99px; background: var(--down); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .tok { margin-left: auto; font-size: 15px; font-weight: 800; color: var(--blue);
         border: 1.5px solid rgba(0,98,255,.4); background: rgba(0,98,255,.06);
         border-radius: 99px; padding: 5px 14px; }
  .price-row { display: flex; align-items: baseline; gap: 16px; margin: 14px 0 6px; }
  .price { font-size: 64px; font-weight: 850; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .price.bump { animation: bump .55s cubic-bezier(.2, 2.2, .4, 1); }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.13); } 100% { transform: scale(1); } }
  .price.dip { animation: dip .5s ease; }
  @keyframes dip { 0% { transform: scale(1); } 40% { transform: scale(0.94); } 100% { transform: scale(1); } }
  .delta { font-size: 22px; font-weight: 800; color: var(--up); }
  .delta.neg { color: var(--down); }
  .sub { font-size: 13px; color: var(--ink-2); }
  .chart { margin-top: 10px; }
  .flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 5px rgba(0,98,255,.75), 0 24px 70px rgba(10,20,60,.35); } 100% { box-shadow: 0 24px 70px rgba(10,20,60,.35); } }
  .flash-red { animation: flashr 1s ease-out; }
  @keyframes flashr { 0% { box-shadow: 0 0 0 5px rgba(220,38,38,.7), 0 24px 70px rgba(10,20,60,.35); } 100% { box-shadow: 0 24px 70px rgba(10,20,60,.35); } }

  /* floating +$ particle */
  .pop {
    position: fixed; font-size: 30px; font-weight: 850; color: var(--up);
    text-shadow: 0 2px 14px rgba(255,255,255,.9); pointer-events: none;
    animation: rise 1.5s ease-out forwards;
  }
  .pop.neg { color: var(--down); }
  @keyframes rise { 0% { opacity: 0; transform: translateY(12px) scale(.8); }
                    18% { opacity: 1; transform: translateY(0) scale(1.15); }
                    100% { opacity: 0; transform: translateY(-90px) scale(1); } }

  /* event pop */
  .events { position: fixed; left: 48px; bottom: 400px; display: flex; flex-direction: column; gap: 12px; }
  .event {
    align-self: flex-start; background: var(--card); border: 1px solid rgba(255,255,255,.65);
    border-left: 6px solid var(--blue); border-radius: 16px; padding: 14px 22px;
    font-size: 19px; font-weight: 800; opacity: 0; transform: translateX(-24px) scale(.95);
    transition: opacity .3s, transform .35s cubic-bezier(.2, 1.6, .4, 1);
    backdrop-filter: blur(14px); box-shadow: 0 14px 40px rgba(10,20,60,.25);
  }
  .event.neg { border-left-color: var(--down); }
  .event.show { opacity: 1; transform: translateX(0) scale(1); }
  .event small { display: block; font-weight: 600; font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .event .d { color: var(--up); margin-left: 12px; }
  .event.neg .d { color: var(--down); }

  .hint { position: fixed; top: 18px; right: 22px; font-size: 12.5px; color: #B6C2D9; text-align: right; line-height: 1.8; }
  kbd { border: 1px solid rgba(255,255,255,.3); border-radius: 5px; padding: 0 6px; font-size: 11px; }
</style>
</head>
<body>
<div class="hint">
  <kbd>Space</kbd> next event · <kbd>A</kbd> autoplay · <kbd>R</kbd> reset · <kbd>G</kbd> green screen<br>
  Record this window and composite over game footage.
</div>

<div class="events" id="events"></div>

<div class="lower" id="card">
  <div class="head">
    <div class="glyph"><img src="logo.png" alt=""></div>
    <div class="who">
      <b>Azan Evans</b>
      <span class="live"><i></i> SG · NUS · Sophomore — LIVE</span>
    </div>
    <span class="tok">$AZAN</span>
  </div>
  <div class="price-row">
    <span class="price" id="price">$197.24</span>
    <span class="delta" id="delta">▲ +0.0%</span>
  </div>
  <div class="sub">Last traded price · Agora fair value $197.24 · <span id="vol">0</span> trades this season</div>
  <svg class="chart" id="chart" width="584" height="130" viewBox="0 0 584 130" aria-label="live price"></svg>
</div>

<script>
(() => {
  const START = 197.24;
  const SCRIPT = [
    ["20+ points, six straight games", "Weeks 5–6 · scoring streak", +8.60, false],
    ["Career-high 15 rebounds", "Game 13 · glass cleaned", +6.20, false],
    ["Back-to-back triple-doubles", "Games 14–15 · first in NUS history", +9.40, false],
    ["Season-high 6 blocks", "Game 16 · rim closed", +5.80, false],
    ["League Player of the Week", "Week 6 honors", +7.40, false],
    ["Career-high 34 points", "Game 17 · takeover", +9.80, false],
    ["Named Mid-Season All-League Five", "Season honors", +10.20, false],
    ["Seventh straight win as starter", "Team surge · undefeated stretch", +6.40, false],
  ];
  let i = 0, price = START, target = START, pts = [[0, START]], auto = null, vol = 0;

  const $ = id => document.getElementById(id);
  const fmt = v => "$" + v.toFixed(2);

  function draw() {
    const svg = $("chart");
    svg.replaceChildren();
    const W = 584, H = 130, pad = 8;
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    // tight y-domain makes every move LOOK big (drama without changing numbers)
    const x1 = Math.max(9, Math.max(...xs));
    const lo = Math.min(...ys) * 0.997, hi = Math.max(...ys) * 1.003;
    const X = x => pad + x / x1 * (W - 2 * pad);
    const Y = y => H - pad - (y - lo) / (hi - lo || 1) * (H - 2 * pad);
    const d = pts.map((p, j) => (j ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
    const mk = (tag, attrs) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) n.setAttribute(k, attrs[k]); svg.appendChild(n); return n; };
    mk("path", { d: d + ` L ${X(pts[pts.length-1][0])} ${H-pad} L ${X(0)} ${H-pad} Z`, fill: "rgba(0,98,255,.10)" });
    mk("path", { d, fill: "none", stroke: "#0062FF", "stroke-width": 3.5, "stroke-linejoin": "round", "stroke-linecap": "round" });
    const last = pts[pts.length - 1];
    mk("circle", { cx: X(last[0]), cy: Y(last[1]), r: 6, fill: "#0062FF", stroke: "#fff", "stroke-width": 2.5 });
  }

  let animTimer = null;
  function animateTo(target, ms = 1100) {
    // interval-driven (not rAF): keeps animating while being screen-captured
    if (animTimer) clearInterval(animTimer);
    const from = price, t0 = performance.now();
    animTimer = setInterval(() => {
      const f = Math.min(1, (performance.now() - t0) / ms);
      const o = 1.7;   // overshoot: punches past the target, settles back
      const eased = f < 1 ? 1 + (o + 1) * Math.pow(f - 1, 3) + o * Math.pow(f - 1, 2) : 1;
      price = from + (target - from) * eased;
      $("price").textContent = fmt(price);
      const d = (price / START - 1) * 100;
      const el = $("delta");
      el.textContent = (d >= 0 ? "▲ +" : "▼ ") + d.toFixed(1) + "%";
      el.className = "delta" + (d < 0 ? " neg" : "");
      pts[pts.length - 1][1] = price;
      draw();
      if (f >= 1) { clearInterval(animTimer); animTimer = null; price = target; }
    }, 16);
  }

  function particle(delta, neg) {
    const p = document.createElement("div");
    p.className = "pop" + (neg ? " neg" : "");
    p.textContent = (neg ? "−" : "+") + "$" + Math.abs(delta).toFixed(2);
    p.style.left = (330 + Math.random() * 120) + "px";
    p.style.bottom = "210px";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }

  function fire() {
    if (i >= SCRIPT.length) return;
    const [label, sub, delta, neg] = SCRIPT[i];
    i += 1; vol += 1 + Math.round(Math.abs(delta) * 3);
    $("vol").textContent = vol;
    const ev = document.createElement("div");
    ev.className = "event" + (neg ? " neg" : "");
    const line = document.createElement("span");
    line.textContent = label;
    const dd = document.createElement("span");
    dd.className = "d";
    dd.textContent = (delta >= 0 ? "+" : "−") + "$" + Math.abs(delta).toFixed(2);
    line.appendChild(dd);
    ev.appendChild(line);
    const small = document.createElement("small");
    small.textContent = sub;
    ev.appendChild(small);
    $("events").appendChild(ev);
    requestAnimationFrame(() => ev.classList.add("show"));
    setTimeout(() => { ev.classList.remove("show"); setTimeout(() => ev.remove(), 450); }, 3000);
    const card = $("card"), pr = $("price");
    card.classList.remove("flash", "flash-red");
    pr.classList.remove("bump", "dip");
    void card.offsetWidth;
    card.classList.add(neg ? "flash-red" : "flash");
    pr.classList.add(neg ? "dip" : "bump");
    particle(delta, neg);
    pts.push([pts.length, price]);
    target += delta;                 // cumulative — double-taps never drop value
    animateTo(target);
  }

  function reset() {
    i = 0; price = START; target = START; pts = [[0, START]]; vol = 0;
    if (auto) { clearInterval(auto); auto = null; }
    if (animTimer) { clearInterval(animTimer); animTimer = null; }
    $("price").textContent = fmt(START);
    $("delta").textContent = "▲ +0.0%";
    $("delta").className = "delta";
    $("vol").textContent = "0";
    $("events").replaceChildren();
    draw();
  }

  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); fire(); }
    else if (e.key === "a" || e.key === "A") {
      if (auto) { clearInterval(auto); auto = null; }
      else { fire(); auto = setInterval(() => { fire(); if (i >= SCRIPT.length) { clearInterval(auto); auto = null; } }, 3600); }
    }
    else if (e.key === "r" || e.key === "R") reset();
    else if (e.key === "g" || e.key === "G") document.body.classList.toggle("chroma");
  });
  draw();
})();
</script>
</body>
</html>
