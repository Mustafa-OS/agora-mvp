<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora — $AZAN broadcast overlay</title>
<style>
  :root {
    --ink: #f2f5f7; --ink-2: #a9b1ba; --up: #3DFF8C; --down: #f87171;
    --card: rgba(10, 12, 15, 0.86); --hairline: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0b0d10; color: var(--ink); overflow: hidden;
  }
  body.chroma { background: #00ff00; }
  body.chroma .hint { display: none; }

  /* lower-third card */
  .lower {
    position: fixed; left: 40px; bottom: 40px; width: 460px;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 18px;
    padding: 18px 20px 14px; backdrop-filter: blur(12px);
    box-shadow: 0 12px 50px rgba(0,0,0,.5), 0 0 30px rgba(61,255,140,.07);
  }
  .head { display: flex; align-items: center; gap: 12px; }
  .glyph { width: 40px; height: 40px; border-radius: 10px; background: #22c55e; display: grid; place-items: center; }
  .glyph b { color: #0b0d10; font-size: 20px; }
  .who b { font-size: 19px; display: block; }
  .who span { font-size: 12px; color: var(--ink-2); }
  .tok { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--up);
         border: 1px solid rgba(61,255,140,.4); border-radius: 99px; padding: 3px 10px; }
  .price-row { display: flex; align-items: baseline; gap: 12px; margin: 12px 0 4px; }
  .price { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .delta { font-size: 16px; font-weight: 700; color: var(--up); }
  .delta.neg { color: var(--down); }
  .sub { font-size: 11.5px; color: var(--ink-2); }
  .chart { margin-top: 8px; }
  .flash { animation: flash .8s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px rgba(61,255,140,.8), 0 12px 50px rgba(0,0,0,.5); } 100% { box-shadow: 0 12px 50px rgba(0,0,0,.5); } }
  .flash-red { animation: flashr .8s ease-out; }
  @keyframes flashr { 0% { box-shadow: 0 0 0 3px rgba(248,113,113,.8), 0 12px 50px rgba(0,0,0,.5); } 100% { box-shadow: 0 12px 50px rgba(0,0,0,.5); } }

  /* event pop */
  .events { position: fixed; left: 40px; bottom: 300px; display: flex; flex-direction: column; gap: 10px; }
  .event {
    align-self: flex-start; background: var(--card); border: 1px solid rgba(61,255,140,.45);
    border-left: 4px solid var(--up); border-radius: 12px; padding: 10px 16px;
    font-size: 15px; font-weight: 700; opacity: 0; transform: translateY(14px);
    transition: opacity .25s, transform .25s; backdrop-filter: blur(10px);
  }
  .event.neg { border-color: rgba(248,113,113,.45); border-left-color: var(--down); }
  .event.show { opacity: 1; transform: translateY(0); }
  .event small { display: block; font-weight: 600; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  .event .d { color: var(--up); margin-left: 10px; }
  .event.neg .d { color: var(--down); }

  .hint { position: fixed; top: 16px; right: 20px; font-size: 12px; color: var(--ink-2); text-align: right; line-height: 1.7; }
  kbd { border: 1px solid var(--hairline); border-radius: 5px; padding: 0 6px; font-size: 11px; }
</style>
</head>
<body>
<div class="hint">
  <kbd>Space</kbd> next event · <kbd>A</kbd> autoplay · <kbd>R</kbd> reset · <kbd>G</kbd> green screen<br>
  Record this window and composite over game footage.
</div>

<div class="events" id="events"></div>

<div class="lower" id="card">
  <div class="head">
    <div class="glyph"><b>A</b></div>
    <div class="who">
      <b>Azan Evans</b>
      <span>SG · NUS · Sophomore — LIVE</span>
    </div>
    <span class="tok">$AZAN</span>
  </div>
  <div class="price-row">
    <span class="price" id="price">$13.90</span>
    <span class="delta" id="delta">▲ +0.0%</span>
  </div>
  <div class="sub">Last traded price · Agora fair value $13.90 · <span id="vol">0</span> trades tonight</div>
  <svg class="chart" id="chart" width="420" height="90" viewBox="0 0 420 90" aria-label="live price"></svg>
</div>

<script>
(() => {
  const START = 13.90;
  // (label, sublabel, delta$, negative?)
  const SCRIPT = [
    ["Pull-up three ✓", "Q1 04:12 · $AZAN +3 PTS", +1.40, false],
    ["And-one finish ✓", "Q1 01:45 · fouled, converts", +1.10, false],
    ["Turnover", "Q2 08:30 · stripped on the drive", -0.60, true],
    ["Corner three ✓", "Q2 05:02 · 3-for-3 from deep", +1.80, false],
    ["Chase-down block", "Q2 00:41 · momentum swing", +1.30, false],
    ["12 PTS at the half", "market re-rating live", +2.20, false],
    ["Steal → dunk", "Q3 07:19 · house on fire", +2.60, false],
    ["Missed FT", "Q3 03:55", -0.40, true],
    ["Step-back three ✓", "Q4 06:24 · 21 PTS", +2.90, false],
    ["Game-winner ✓✓", "Q4 00:02 · 24 PTS / 6 AST", +4.80, false],
  ];
  let i = 0, price = START, pts = [[0, START]], auto = null, vol = 0;

  const $ = id => document.getElementById(id);
  const fmt = v => "$" + v.toFixed(2);

  function draw() {
    const svg = $("chart");
    svg.replaceChildren();
    const W = 420, H = 90, pad = 6;
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const x0 = 0, x1 = Math.max(9, Math.max(...xs)), lo = Math.min(...ys) * 0.985, hi = Math.max(...ys) * 1.015;
    const X = x => pad + (x - x0) / (x1 - x0) * (W - 2 * pad);
    const Y = y => H - pad - (y - lo) / (hi - lo) * (H - 2 * pad);
    const d = pts.map((p, j) => (j ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
    const mk = (tag, attrs) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) n.setAttribute(k, attrs[k]); svg.appendChild(n); return n; };
    mk("path", { d: d + ` L ${X(pts[pts.length-1][0])} ${H-pad} L ${X(0)} ${H-pad} Z`, fill: "rgba(61,255,140,.12)" });
    mk("path", { d, fill: "none", stroke: "#3DFF8C", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" });
    const last = pts[pts.length - 1];
    mk("circle", { cx: X(last[0]), cy: Y(last[1]), r: 4.5, fill: "#3DFF8C", stroke: "#0b0d10", "stroke-width": 2 });
  }

  let animTimer = null;
  function animateTo(target, ms = 900) {
    // interval-driven (not rAF): stays smooth even when the window is
    // occluded or being captured by a screen recorder
    if (animTimer) clearInterval(animTimer);
    const from = price, t0 = performance.now();
    animTimer = setInterval(() => {
      const f = Math.min(1, (performance.now() - t0) / ms);
      const eased = f * f * (3 - 2 * f);
      price = from + (target - from) * eased;
      $("price").textContent = fmt(price);
      const d = (price / START - 1) * 100;
      const el = $("delta");
      el.textContent = (d >= 0 ? "▲ +" : "▼ ") + d.toFixed(1) + "%";
      el.className = "delta" + (d < 0 ? " neg" : "");
      pts[pts.length - 1][1] = price;
      draw();
      if (f >= 1) { clearInterval(animTimer); animTimer = null; }
    }, 16);
  }

  function fire() {
    if (i >= SCRIPT.length) return;
    const [label, sub, delta, neg] = SCRIPT[i];
    i += 1; vol += 1 + Math.round(Math.abs(delta) * 3);
    $("vol").textContent = vol;
    const ev = document.createElement("div");
    ev.className = "event" + (neg ? " neg" : "");
    ev.innerHTML = "";
    const line = document.createElement("span");
    line.textContent = label;
    const dd = document.createElement("span");
    dd.className = "d";
    dd.textContent = (delta >= 0 ? "+" : "−") + "$" + Math.abs(delta).toFixed(2);
    line.appendChild(dd);
    ev.appendChild(line);
    const small = document.createElement("small");
    small.textContent = sub;
    ev.appendChild(small);
    $("events").appendChild(ev);
    setTimeout(() => ev.classList.add("show"), 20);
    setTimeout(() => { ev.classList.remove("show"); setTimeout(() => ev.remove(), 400); }, 2600);
    const card = $("card");
    card.classList.remove("flash", "flash-red");
    void card.offsetWidth;
    card.classList.add(neg ? "flash-red" : "flash");
    pts.push([pts.length, price]);
    animateTo(price + delta);
  }

  function reset() {
    i = 0; price = START; pts = [[0, START]]; vol = 0;
    if (auto) { clearInterval(auto); auto = null; }
    $("price").textContent = fmt(START);
    $("delta").textContent = "▲ +0.0%";
    $("delta").className = "delta";
    $("vol").textContent = "0";
    $("events").replaceChildren();
    draw();
  }

  addEventListener("keydown", e => {
    if (e.code === "Space") { e.preventDefault(); fire(); }
    else if (e.key === "a" || e.key === "A") {
      if (auto) { clearInterval(auto); auto = null; }
      else { fire(); auto = setInterval(() => { fire(); if (i >= SCRIPT.length) { clearInterval(auto); auto = null; } }, 3400); }
    }
    else if (e.key === "r" || e.key === "R") reset();
    else if (e.key === "g" || e.key === "G") document.body.classList.toggle("chroma");
  });
  draw();
})();
</script>
</body>
</html>
